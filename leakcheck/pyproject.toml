[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck"
version = "0.1.0"
description = "Report how well your features identify the animal next to how well they identify the behaviour."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vishrut Malhotra", email = "vishrutmalhotra4@gmail.com" }]
keywords = ["bioacoustics", "evaluation", "data-leakage", "conservation", "machine-learning"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/slug-labz/Audio-Jungle-Book-Project"
Source = "https://github.com/slug-labz/Audio-Jungle-Book-Project/tree/dev/leakcheck"

[project.scripts]
leakcheck = "leakcheck.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
